name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble the site
        run: |
          set -euo pipefail
          python -m pip install --quiet markdown
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/robots.txt site/sitemap.xml _site/
          # The method docs carry the derivations. Served as raw markdown they are
          # unreadable in a browser and invisible to search, so they are rendered.
          python site/build.py _site
      - name: Check every rendered page came out
        run: |
          set -euo pipefail
          for page in docs/methods/index docs/methods/prediction-powered-inference \
                      docs/methods/confidence-sequences docs/methods/judge-bias-and-slices \
                      docs/methods/contamination findings/mt-bench \
                      findings/judge-leaderboards; do
            test -s "_site/${page}.html" || {
              echo "missing or empty: ${page}.html"; exit 1; }
          done
          # A link left pointing at .md would 404 for every reader who followed it.
          ! grep -rq 'href="[^"]*\.md"' _site/docs/methods/ || {
            echo "a markdown link survived rendering"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
