name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Generate sample data
        run: python examples/generate_sample_data.py
      - name: pytest
        run: pytest -q
      - name: ruff
        run: |
          ruff check src tests examples
          ruff format --check src tests examples
      - name: mypy
        run: mypy
      - name: Examples run end to end
        run: |
          for f in examples/0*.py examples/judge_correction.py; do
            echo "--- $f"
            python "$f" > /dev/null
          done
      - name: Conformance against the reference PPI implementation
        # ppi-python pulls in numba, pandas and scikit-learn, and its numba pin does not
        # build on 3.10, so this runs on the newest interpreter only. The test file skips
        # itself when the package is absent, which is what the other matrix legs do.
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          pip install -e '.[conformance]'
          pytest tests/test_conformance.py -q

      - name: CLI exit codes are meaningful
        run: |
          set +e
          python -m truescore.cli audit examples/data/support_eval.csv \
            --judge judge_passed --gold human_passed > /dev/null
          test $? -eq 2 || { echo "audit should report a finding"; exit 1; }
          python -m truescore.cli audit examples/data/support_eval.csv \
            --judge absent_column --gold human_passed > /dev/null 2>&1
          test $? -eq 1 || { echo "a bad column should be an error, not a finding"; exit 1; }
          python -m truescore.cli contamination examples/data/contamination_logliks.csv > /dev/null
          test $? -eq 0 || { echo "clean data should exit 0"; exit 1; }
